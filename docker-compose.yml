# LOCAL DEVELOPMENT ONLY.
#
# This publishes to 127.0.0.1, which a platform's reverse proxy (Coolify's
# Traefik, for one) cannot reach — pointing a deploy at this file gets a
# container nothing can talk to. Deployments build the Dockerfile directly;
# see docs/DEPLOY.md, which also lists the variables that matter in
# production and are deliberately absent here.

services:
  areyousievious:
    build: .
    container_name: areyousievious
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      - AYS_CORS_ORIGINS=https://areyousievious.com,http://localhost:5173
      - AYS_SECURE_COOKIES=true
      # ⚠️  Testing only — uncomment to skip outbound IMAP TLS verification
      # for a self-signed mail server. NEVER enable in production: leaves
      # the IMAP login open to MITM credential theft (CWE-295).
      # - AYS_IMAP_INSECURE=1
    restart: unless-stopped
